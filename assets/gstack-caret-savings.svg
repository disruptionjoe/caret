<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">GStack Caret savings</title>
  <desc id="desc">Results table showing token savings with full behavioral parity when Caret is applied to three GStack skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#171a20" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d65f24" />
      <stop offset="100%" stop-color="#f18a36" />
    </linearGradient>
    <style>
      .title { font: 700 52px 'Segoe UI', Arial, sans-serif; fill: #f6f3ee; }
      .sub { font: 400 24px 'Segoe UI', Arial, sans-serif; fill: #cfc6bc; }
      .head { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #f6f3ee; }
      .cell { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #ece5dc; }
      .pill { font: 700 20px 'Consolas', 'SFMono-Regular', monospace; fill: #f7efe5; }
      .metric { font: 700 88px 'Segoe UI', Arial, sans-serif; fill: url(#accent); }
      .metricSub { font: 600 24px 'Segoe UI', Arial, sans-serif; fill: #f0b487; letter-spacing: 2px; }
      .parity { font: 700 20px 'Consolas', 'SFMono-Regular', monospace; }
      .pass { fill: #4ade80; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)" />

  <text x="76" y="96" class="title">GStack Caret Savings</text>
  <text x="76" y="136" class="sub">Parity-validated hybrid rewrites across three large GStack skills.</text>

  <text x="1080" y="120" text-anchor="end" class="metric">39.2%</text>
  <text x="1080" y="156" text-anchor="end" class="metricSub">SHORTER · PARITY PASS</text>

  <g transform="translate(76,196)">
    <rect width="1248" height="456" rx="20" fill="#111419" stroke="#343a44" stroke-width="2" />
    <line x1="0" y1="94" x2="1248" y2="94" stroke="#343a44" stroke-width="2" />
    <line x1="300" y1="0" x2="300" y2="456" stroke="#343a44" stroke-width="2" />
    <line x1="560" y1="0" x2="560" y2="456" stroke="#343a44" stroke-width="2" />
    <line x1="820" y1="0" x2="820" y2="456" stroke="#343a44" stroke-width="2" />
    <line x1="960" y1="0" x2="960" y2="456" stroke="#343a44" stroke-width="2" />
    <line x1="1100" y1="0" x2="1100" y2="456" stroke="#343a44" stroke-width="2" />
    <line x1="0" y1="215" x2="1248" y2="215" stroke="#2a3038" stroke-width="2" />
    <line x1="0" y1="336" x2="1248" y2="336" stroke="#2a3038" stroke-width="2" />

    <text x="38" y="58" class="head">Skill</text>
    <text x="338" y="58" class="head">Original (chars)</text>
    <text x="598" y="58" class="head">Rewrite (chars)</text>
    <text x="858" y="58" class="head">Shorter</text>
    <text x="998" y="58" class="head">Parity</text>
    <text x="1138" y="58" class="head">Call</text>

    <g transform="translate(28,124)">
      <rect width="182" height="48" rx="14" fill="#1d222b" />
      <text x="20" y="31" class="pill">design-review</text>
      <text x="330" y="31" class="cell" text-anchor="middle">59,201</text>
      <text x="570" y="31" class="cell" text-anchor="middle">33,771</text>
      <text x="870" y="31" class="cell" text-anchor="middle">43.0%</text>
      <text x="1010" y="31" class="parity pass" text-anchor="middle">pass</text>
      <text x="1158" y="31" class="cell" text-anchor="middle">hybrid</text>
    </g>

    <g transform="translate(28,245)">
      <rect width="96" height="48" rx="14" fill="#1d222b" />
      <text x="20" y="31" class="pill">ship</text>
      <text x="330" y="31" class="cell" text-anchor="middle">97,322</text>
      <text x="570" y="31" class="cell" text-anchor="middle">43,774</text>
      <text x="870" y="31" class="cell" text-anchor="middle">55.0%</text>
      <text x="1010" y="31" class="parity pass" text-anchor="middle">pass</text>
      <text x="1158" y="31" class="cell" text-anchor="middle">hybrid</text>
    </g>

    <g transform="translate(28,366)">
      <rect width="250" height="48" rx="14" fill="#1d222b" />
      <text x="20" y="31" class="pill">plan-eng-review</text>
      <text x="330" y="31" class="cell" text-anchor="middle">63,549</text>
      <text x="570" y="31" class="cell" text-anchor="middle">56,274</text>
      <text x="870" y="31" class="cell" text-anchor="middle">11.5%</text>
      <text x="1010" y="31" class="parity pass" text-anchor="middle">pass</text>
      <text x="1158" y="31" class="cell" text-anchor="middle">hybrid</text>
    </g>
  </g>
</svg>
